name: Set up the BEAM
description: >
  The one place CI pins Erlang/OTP and Elixir, restores the dependency and
  build cache for the requested MIX_ENV, and fetches dependencies. Every job
  uses this action, so the toolchain cannot drift between jobs, and the
  version appears in cache keys by reference rather than as a copied
  literal.

inputs:
  mix-env:
    description: The MIX_ENV to fetch and build for.
    required: false
    default: test
  deps-token:
    description: >
      GitHub token (a PAT secret) used to fetch private git dependencies.
      Empty means anonymous fetch — correct while every first-party dep
      (ash_rules, ash_compliance, ash_bpmn, ash_decisions, ash_agent_tools)
      is public. DEC-PUB flips those public; until that flip lands this
      input is the escape hatch.
    required: false
    default: ""

outputs:
  elixir-version:
    description: The pinned Elixir version, for cache keys.
    value: ${{ steps.pin.outputs.elixir-version }}

runs:
  using: composite
  steps:
    # Pinned to the pairing the local compile lane uses (ash_enterprise's
    # devenv, which carries Elixir 1.20.3 — CI pins 1.20.4, the same accepted
    # patch skew ash_enterprise's CI documents). CI drifting from local is
    # how "works on my machine" becomes a class of bug rather than an
    # incident.
    - id: pin
      shell: bash
      run: |
        echo "otp-version=27.3.4" >> "$GITHUB_OUTPUT"
        echo "elixir-version=1.20.4" >> "$GITHUB_OUTPUT"

    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ steps.pin.outputs.otp-version }}
        elixir-version: ${{ steps.pin.outputs.elixir-version }}

    - name: Authenticate private dependency fetches
      if: ${{ inputs.deps-token != '' }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ inputs.deps-token }}@github.com/".insteadOf "https://github.com/"

    # Keyed per Elixir version. _build is not portable across compilers, so
    # the version rides the key: a cache written by an older compiler must
    # never be restored here.
    - uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ inputs.mix-env }}-${{ steps.pin.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ inputs.mix-env }}-${{ steps.pin.outputs.elixir-version }}-

    - name: Install hex and rebar
      shell: bash
      run: |
        mix local.hex --force
        mix local.rebar --force

    - name: Fetch dependencies
      shell: bash
      env:
        MIX_ENV: ${{ inputs.mix-env }}
      run: mix deps.get
