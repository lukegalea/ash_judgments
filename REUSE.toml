version = 1

# Source files carry their own SPDX header; this annotation covers everything
# else (prose docs, dotfiles, the lockfile) so `reuse lint` stays clean from
# day one — the cautionary example is ash_agent_tools, whose REUSE state ran
# red until AST-1 fixed it.
[[annotations]]
path = [
  ".gitignore",
  "AGENTS.md",
  "REUSE.toml",
  "README.md",
  "mix.lock",
  "priv/judgments/*.json",
  "scripts/extra-docs.baseline",
  "scripts/iron-laws.baseline.json",
  "usage-rules.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_judgments contributors <https://github.com/lukegalea/ash_judgments>"
SPDX-License-Identifier = "MIT"
